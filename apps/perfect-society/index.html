<style>
/* Layout: one narrow reading column, like a charter being drafted; setup, then one question per screen, then the analysis. */
:root {
  --bg: #eef0ec;
  --paper: #fbfbf8;
  --ink: #1b2230;
  --muted: #5b6370;
  --rule: #d3d7d0;
  --accent: #3E5C6B;      /* Dougalien Systems slate */
  --accent-soft: #e2e9ec;
  --seal: #B4532A;        /* Dougalien Systems rust */
  --bar: #a9bcc5;
  --on-accent: #ffffff;
  --display: "Libre Caslon Text", "Iowan Old Style", Georgia, serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --paper: #182027; --ink: #e5e8e6; --muted: #9aa3ab; --rule: #2c3741;
    --accent: #D6B27C; --accent-soft: #3a3226; --seal: #e08a72; --bar: #4f5f68; --on-accent: #1B1E20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --paper: #182027; --ink: #e5e8e6; --muted: #9aa3ab; --rule: #2c3741;
  --accent: #D6B27C; --accent-soft: #3a3226; --seal: #e08a72; --bar: #4f5f68; --on-accent: #1B1E20;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(2.1rem, 6vw, 3rem); }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; }
p { margin: 0; }
.eyebrow { font: 500 0.75rem/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 24px; }
header.mast { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 20px; }
header.mast p { max-width: 60ch; color: var(--muted); }

button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); padding: 10px 20px; border-radius: 4px; font-weight: 700; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.chip { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 0.9rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0; font-size: 0.95rem; }
:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }

/* Setup */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.thinker { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; padding: 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); cursor: pointer; }
.thinker:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.thinker input { margin-top: 5px; accent-color: var(--accent); width: 16px; height: 16px; }
.thinker strong { font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
.thinker .lived { grid-column: 2; font: 0.75rem/1.3 var(--mono); color: var(--muted); }
.thinker .idea { grid-column: 2; font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
.sharebox { display: flex; gap: 8px; flex-wrap: wrap; }
.sharebox input { flex: 1 1 260px; min-width: 0; font: 0.85rem var(--mono); padding: 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); color: var(--ink); }

/* Quiz */
.progress { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width 0.3s; }
.qhead { display: flex; justify-content: space-between; gap: 12px; font: 0.8rem var(--mono); color: var(--muted); }
.question { font-size: clamp(1.4rem, 4vw, 1.9rem); }
.answers { display: flex; flex-direction: column; gap: 10px; }
.answer { text-align: left; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); padding: 14px 16px; border-radius: 4px; display: grid; grid-template-columns: 1.6rem 1fr; gap: 10px; line-height: 1.4; }
.answer .letter { font: 500 0.85rem/1.6 var(--mono); color: var(--muted); }
.answer:hover { border-color: var(--accent); }
.answer[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.answer[aria-pressed="true"] .letter { color: var(--accent); }
.matters { display: flex; gap: 8px; align-items: center; font-size: 0.95rem; color: var(--muted); }
.matters input { accent-color: var(--seal); width: 18px; height: 18px; }
.nav { display: flex; justify-content: space-between; gap: 10px; }

/* Results */
.verdict { display: flex; flex-direction: column; gap: 8px; }
.verdict .big { font-family: var(--display); font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; }
.verdict .big em { color: var(--accent); font-style: italic; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(7rem, 12rem) 1fr 3.2rem; gap: 10px; align-items: center; font-size: 0.92rem; }
.bar .track { height: 14px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--bar); }
.bar.top .fill { background: var(--accent); }
.bar.top .name { font-weight: 700; }
.bar .pct { font: 0.9rem var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.match { display: flex; flex-direction: column; gap: 12px; padding-block: 20px; border-top: 1px solid var(--rule); }
.match:first-of-type { border-top: none; padding-top: 0; }
.match .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.match .head .pct { font: 500 1.1rem var(--mono); color: var(--accent); }
blockquote { margin: 0; padding-left: 14px; border-left: 2px solid var(--seal); font-family: var(--display); font-style: italic; color: var(--ink); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pair > div { min-width: 0; }
.pair h4 { margin: 0 0 6px; font: 500 0.75rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.pair ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.charter { display: flex; flex-direction: column; gap: 14px; }
.article { display: grid; grid-template-columns: 6.5rem 1fr; gap: 12px; }
.article .num { font: 500 0.75rem/1.9 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--seal); }
.article ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-family: var(--display); }
.article .star { color: var(--seal); font-family: var(--body); font-size: 0.8rem; }
ol.discuss { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.toast { font-size: 0.9rem; color: var(--accent); }
a { color: var(--accent); }
.src { display: block; margin-top: 2px; font-size: 0.8rem; line-height: 1.35; color: var(--muted); }
.src a { color: var(--muted); text-decoration-color: var(--rule); }
.src a:hover { color: var(--accent); }
blockquote .src { font-family: var(--body); font-style: normal; }
.reading { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.reading .note { color: var(--muted); font-size: 0.82rem; }
.key-q { display: flex; flex-direction: column; gap: 10px; padding-block: 18px; border-top: 1px solid var(--rule); }
.key-q:first-of-type { border-top: none; padding-top: 0; }
.key-a { display: flex; flex-direction: column; gap: 4px; }
.key-a > strong { font-weight: 700; }
.key-a ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
.key-a .tag { font: 0.72rem var(--mono); color: var(--seal); }
/* Timeline */
.chartwrap { overflow-x: auto; }
.tl { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--rule); margin-left: 6px; }
.tl-item { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 26px 22px; }
.tl-item::before { content: ""; position: absolute; left: -7px; top: 9px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.tl-item.off::before { background: var(--rule); }
.tl-item.off { opacity: 0.7; }
.tl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tl-head .pct { font: 500 0.85rem var(--mono); color: var(--accent); }
.tl-item .lived { font: 0.8rem var(--mono); color: var(--muted); }
.tl-item h4 { margin: 4px 0 0; font: 500 0.72rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--seal); }
.events { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.events li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 10px; font-size: 0.93rem; }
.events .when { font: 0.8rem/1.7 var(--mono); color: var(--muted); }
.conn { font-size: 0.93rem; color: var(--muted); }
.conn strong { color: var(--ink); }
@media (max-width: 560px) {
  .events li { grid-template-columns: 1fr; gap: 0; }
  .sheet { padding: 18px; }
  .pair { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 6.5rem 1fr 3rem; font-size: 0.85rem; }
  .article { grid-template-columns: 1fr; gap: 4px; }
}
/* Dougalien Systems: the logo's strata as a stripe across the top, the lockup above the app and a credit below it */
.ds-stripe { position: fixed; inset: 0 0 auto 0; height: 5px; background: linear-gradient(90deg, #D6B27C 0 25%, #3E5C6B 25% 50%, #B4532A 50% 75%, #D6B27C 75%); z-index: 10; }
.ds-brand { max-width: 760px; margin: 0 auto 20px; }
.ds-brand a { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 700 1rem/1.2 var(--body); border-radius: 4px; }
.ds-brand a:hover span { text-decoration: underline; }
.ds-brand svg { width: 34px; height: 34px; flex: none; }
.ds-brand small { display: block; font: 400 0.8rem/1.3 var(--body); color: var(--muted); }
.ds-credit { max-width: 760px; margin: 40px auto 0; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 0.9rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

": "1494", "what": "France invades Italy, and the Medici family is driven out of Florence."}, {"when": "1512–1513", "what": "The Medici return. Machiavelli is fired, jailed, and tortured, then writes The Prince in exile."}], "link": "He drew his lessons from ancient Roman history. Hobbes and later political realists built on his clear-eyed view of power.", "cites": {"0": {"work": "prince", "loc": "ch. 17", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/ch17.htm", "general": false}, "1": {"work": "discourses", "loc": "Book I, ch. 3", "url": "https://gutenberg.org/files/10827/old/10827-h/10827-h.htm", "general": false}, "3": {"work": "prince", "loc": "", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/index.htm", "general": true}, "4": {"work": "prince", "loc": "ch. 12", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/ch12.htm", "general": false}, "5": {"work": "prince", "loc": "", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/index.htm", "general": true}, "6": {"work": "prince", "loc": "", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/index.htm", "general": true}, "8": {"work": "prince", "loc": "ch. 17–18", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/ch17.htm", "general": false}, "10": {"work": "prince", "loc": "", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/index.htm", "general": true}, "17": {"work": "prince", "loc": "", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/index.htm", "general": true}, "19": {"work": "prince", "loc": "", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/index.htm", "general": true}}, "quoteSrc": {"work": "prince", "loc": "ch. 17", "url": "https://www.marxists.org/reference/archive/machiavelli/works/prince/ch17.htm"}, "read": ["prince", "discourses"], "life": [{"label": "Wikipedi , ch. 8", "url": "https://www.marxists.org/reference/subject/economics/rousseau/social-contract/ch01.htm", "general": false}, "13": {"work": "inequality", "loc": "Part II, opening", "url": "https://www.marxists.org/reference/subject/economics/rousseau/inequality/ch02.htm", "general": false}, "14": {"work": "social_contract", "loc": "", "url": "https://www.marxists.org/reference/subject/economics/rousseau/social-contract/index.htm", "general": true}, "15": {"work": "emile", "loc": "Book V", "url": "https://www.online-literature.com/rousseau/emile/5/", "general": false}, "16": {"work": "social_contract", "loc": "", "url": "https://www.marxists.org/reference/subject/economics/rousseau/social-contract/index.htm", "general": true}, "17": {"work": "social_contract", "loc": "", "url": "https://www.marxists.org/reference/subject/economics/rousseau/social-contract/index.htm", "general": true}, "19": {"work": "social_contract", "loc": "", "url": "https://www.marxists.org/reference/subject/economics/rousseau/social-contract/index.htm", "general": true}}, "quoteSrc": {"work": "social_contract", "loc": "Book I, ch. 1", "url": "https://www.marxists.org/reference/subject/economics/rousseau/social-contract/ch01.htm"}, "read": ["social_contract", "inequality", "emile"], "life": [{"label": "Wikipedia: Jean-Jacques Rousseau", "url": "https://en.wikipedia.org/wiki/Jean-Jacques_Rousseau"}]}, {"id": "burke", "code": "bur", "name": "Edmund Burke", "lived": "1729–1797", "where": "Ireland / Britain", "idea": "Change slowly, because tradition holds the wisdom of generations.", "rundown": "Burke watched the French Revolution tear down old institutions and turn violent. He argued that customs and institutions carry lessons learned over centuries, and that reformers who sweep them away do great harm. He supported gradual reform, including for the American colonies, but not revolution.", "quote": "Society is indeed a contract... between those who are living, those who are dead, and those who are ": false}, "10": {"work": "reflections", "loc": "", "url": "https://standardebooks.org/ebooks/edmund-burke/reflections-on-the-revolution-in-france", "general": true}, "11": {"work": "reflections", "loc": "", "url": "https://standardebooks.org/ebooks/edmund-burke/reflections-on-the-revolution-in-france", "general": true}, "13": {"work": "reflections", "loc": "", "url": "https://standardebooks.org/ebooks/edmund-burke/reflections-on-the-revolution-in-france", "general": true}, "14": {"work": "reflections", "loc": "", "url": "https://standardebooks.org/ebooks/edmund-burke/reflections-on-the-revolution-in-france", "general": true}, "15": {"work": "reflections", "loc": "", "url": "https://standardebooks.org/ebooks/edmund-burke/reflections-on-the-revolution-in-france", "general": true}, "16": {"work": "reflections", "loc": "", "url": "https://standardebooks.org/ebooks/edmund-burke/reflections-on-the-revolution-in-france", "general": true}, "19": {"work": "reflections", "loc": "\"A state without the means of some change is without the means of its conservation\"", "url": "https://standardebooks.org/ebooks/edmund-burke/reflections-on-the-revolution-in-france", "general": false}}, "quoteSrc": {"work": "reflections", "loc": "search for \"Society is indeed a contract\"", "url": "https://standardebooks.org/ebooks/edmund-burke/reflections-on-the-revolution-in-france"}, "read": ["reflections"], "life": [{"label": "Wikipedia: Edmund Burke", "url": "https://en.wikipedia.org/wiki/Edmund_Burke"}]}, {"id": "paine", "code": "pai", "name": "Thomas Paine", "lived": "1737–1809", "where": "England / America", "idea": "Government is a necessary evil, and people have the right to overthrow tyranny and govern themselves.", "rundown": "Paine's pamphlet Common Sense convinced many colonists to break from Britain. He argued that all people have equal natural rights, that kings have no right to rule, and that a republic of elected representatives is best. Later, in Agrarian Justice, he proposed a  Wollstonecraft argued that women only seemed less capable because they were denied education. A society that keeps half its people ignorant cannot be truly free or good. She applied Enlightenment ideas about reason and rights to everyone.", "quote": "I do not wish them to have power over men; but over themselves.", "challenge": "Wollstonecraft said women seemed weaker only because they were denied education. What groups today might be held back by unequal education?", "born": 1759, "died": 1797, "era": "revolutions", "world": [{"when": "1789", "what": "The French Revolution declares the Rights of Man, but not the rights of women."}, {"when": "1792", "what": "She publishes A Vindication of the Rights of Woman."}], "link": "She also wrote a reply to Burke (1790). Her daughter, Mary Shelley, wrote Frankenstein.", "cites": {"1": {"work": "vindication", "loc": "ch. 2", "url": "https://www.marxists.org/reference/archive/wollstonecraft-mary/1792/vindication-rights-woman/ch02.htm", "general": false}, "2": {"work": "vindication", "loc": "ch. 12", "url": "https://www.marxists.org/reference/archive/wollstonecraft-mary/1792/vindication-rights-woman/ch12.htm", "general": false}, "3": {"work": "vindication", "loc": "ch. 4", "url": "https://www.marxists.org/reference/archive/wollstonecraft-mary/1792/vindication-rights-woman/ch04.htm", "general": false}, "4": {"work": "vindication", "loc": "", "url": "https://www.marxists.org/reference/archive/wollstonecraft-mary/1792/vindication-rights-woman/", "general": true}, "5": {"work": "vindication", "loc": "", "url": "https://www.marxists.org/reference/archive/wollstonecraft-mary/1792/vindication-rights-woman/", "general": true}, "7": {"work": "vindication", "loc": "", "url": "https://www.marxists.org/reference/archive/wollstonecraft-mary/1792/vindication-rights-woman/", "general": true}, "9": {"work": "vindication", "loc": "", "url": "https://www.marxists.org/reference/archive/wollstonecraft-mary/1792/vindication-rights-woman/", "general .wikipedia.org/wiki/Hannah_Arendt"}]}, {"id": "beauvoir", "code": "bea", "name": "Simone de Beauvoir", "lived": "1908–1986", "where": "France", "idea": "\"One is not born, but becomes, a woman,\" so freedom means escaping the roles society imposes.", "rundown": "In The Second Sex, Beauvoir argued that society treats men as the norm and women as \"the Other.\" Gender roles are taught, not natural, and they limit everyone's freedom. Real freedom means each person can choose who they become, with the economic independence to do it.", "quote": "One is not born but becomes a woman.", "challenge": "Beauvoir said gender roles are learned, not natural. Where do you see people learning what's expected of them because of their gender?", "born": 1908, "died": 1986, "era": "modern", "world": [{"when": "1940–1944", "what": "Germany occupies France during World War II."}, {"when": "1944", "what": "Women in France win the right to vote. The Second Sex follows in 1949."}], "link": "She was the lifelong partner of Jean-Paul Sartre. The Second Sex helped launch the women's movement of the 1960s.", "cites": {"1": {"work": "second_sex", "loc": "Vol. II, opening of \"Childhood\"", "url": "https://www.marxists.org/reference/subject/ethics/de-beauvoir/2nd-sex/introduction.htm", "general": false}, "2": {"work": "ambiguity", "loc": "the whole essay", "url": "https://www.marxists.org/reference/subject/ethics/de-beauvoir/ambiguity/index.htm", "general": false}, "3": {"work": "second_sex", "loc": "", "url": "https://www.marxists.org/reference/subject/ethics/de-beauvoir/2nd-sex/introduction.htm", "general": true}, "10": {"work": "second_sex", "loc": "", "url": "https://www.marxists.org/reference/subject/ethics/de-beauvoir/2nd-sex/introduction.htm", "general": true}, "11": {"work": "second_sex", "loc": "", "url": "https://www.marxists.org/reference/subject/ethics/de-beauvoir/2nd-sex/introduction.htm", "general": true}, "12": {"work": "second_sex", "loc": "Introduction (woman as \"the Other\")", Try Rawls's veil of ignorance: if you didn't know who you'd be born as, what is one rule you'd want your society to have?", "born": 1921, "died": 2002, "era": "modern", "world": [{"when": "1943–1945", "what": "He serves as an infantry soldier in the Pacific during World War II."}, {"when": "1950s–1960s", "what": "The civil rights movement challenges segregation in the United States."}], "link": "He revived the social contract tradition of Locke and Rousseau. Nozick wrote his best-known book as a reply.", "cites": {"4": {"work": "theory_justice", "loc": "", "url": "https://plato.stanford.edu/entries/rawls/", "general": true}, "5": {"work": "theory_justice", "loc": "", "url": "https://plato.stanford.edu/entries/rawls/", "general": true}, "9": {"work": "theory_justice", "loc": "§3, The Main Idea of the Theory of Justice", "url": "https://plato.stanford.edu/entries/rawls/", "general": false}, "12": {"work": "theory_justice", "loc": "", "url": "https://plato.stanford.edu/entries/rawls/", "general": true}, "13": {"work": "theory_justice", "loc": "§13, Democratic Equality and the Difference Principle", "url": "https://plato.stanford.edu/entries/rawls/", "general": false}, "14": {"work": "theory_justice", "loc": "§13, Democratic Equality and the Difference Principle", "url": "https://plato.stanford.edu/entries/rawls/", "general": false}, "16": {"work": "theory_justice", "loc": "§17, The Tendency to Equality", "url": "https://plato.stanford.edu/entries/rawls/", "general": false}, "17": {"work": "theory_justice", "loc": "§13, Democratic Equality and the Difference Principle", "url": "https://plato.stanford.edu/entries/rawls/", "general": false}, "18": {"work": "theory_justice", "loc": "§24, The Veil of Ignorance", "url": "https://plato.stanford.edu/entries/rawls/", "general": false}}, "quoteSrc": {"work": "theory_justice", "loc": "§1, The Role of Justice", "url": "https://plato.stanford.edu/entries/rawls/"}, "read": ["theory_justice"], "life": [{"label": "Stanford Encyclopedia: John Rawls", "url": "https://plato.stanford.edu/entries/rawls/"}, {"label": "Wikipedia: John Rawls", "url": "https://en.wikipedia.org/wiki/John_Rawls"}]}, {"id": "king", "code": "kin", "name": "Martin Luther King Jr.", "lived": "1929–1968", "where": "United States", "idea": "Unjust laws must be resisted peacefully, and justice means equal rights and economic fairness for all.", "rundown": "King led the civil rights movement with nonviolent protest, from the Montgomery bus boycott to the March on Washington. In his Letter from Birmingham Jail, he argued that people have a moral duty to disobey unjust laws, openly and peacefully. Later, he campaigned against poverty as part of the same fight for dignity.", "quote": "Injustice anywhere is a threat to justice everywhere.", "challenge": "King said we have a duty to disobey unjust laws. How do you decide whether a law is unjust? Who gets to decide?", "born": 1929, "died": 1968, "era": "modern", "world": [{"when": "1955–1956", "what": "He leads the Montgomery bus boycott after Rosa Parks is arrested."}, {"when": "1963", "what": "He writes the Letter from Birmingham Jail and gives the \"I Have a Dream\" speech."}], "link": "He studied Gandhi's nonviolence and Thoreau, and quoted the Declaration of Independence as Douglass had.", "cites": {"1": {"work": "birmingham", "loc": "", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": true}, "2": {"work": "birmingham", "loc": "", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": true}, "3": {"work": "birmingham", "loc": "", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": true}, "4": {"work": "birmingham", "loc": "", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": true}, "5": {"work": "birmingham", "loc": "", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": true}, "7": {"work": "birmingham", "loc": "the passage on nonviolent direct action", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": false}, "8": {"work": "birmingham", "loc": "", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": true}, "9": {"work": "birmingham", "loc": "\"A just law is a man-made code that squares with the moral law\"", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": false}, "10": {"work": "birmingham", "loc": "", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": true}, "12": {"work": "birmingham", "loc": "\"segregation distorts the soul and damages the personality\"", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": false}, "13": {"work": "where_go", "loc": "the passage on a guaranteed income", "url": "https://wealthandwant.com/docs/King_Where.htm", "general": false}, "14": {"work": "where_go", "loc": "the passage on a guaranteed income", "url": "https://wealthandwant.com/docs/King_Where.htm", "general": false}, "15": {"work": "birmingham", "loc": "", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": true}, "16": {"work": "dream", "loc": "the whole speech", "url": "https://www.archives.gov/files/press/exhibits/dream-speech.pdf", "general": false}, "17": {"work": "where_go", "loc": "the passage on restructuring society", "url": "https://wealthandwant.com/docs/King_Where.htm", "general": false}, "18": {"work": "birmingham", "loc": "\"Injustice anywhere is a threat to justice everywhere\"", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": false}, "19": {"work": "birmingham", "loc": "the passage on nonviolent direct action", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj", "general": false}}, "quoteSrc": {"work": "birmingham", "loc": "the opening pages", "url": "https://billofrightsinstitute.org/activities/martin-luther-king-jr-letter-from-birmingham-jail-1963-pdj"}, "read": ["birmingham", "where_go", "dream"], "life": [{"label": "Wikipedia: Martin Luther King Jr.", "url": "https://en.wikipedia.org/wiki/Martin_Luther_King_Jr."}]}, {"id": "nozick", "code": "noz", "name": "Robert Nozick", "lived": "1938–2002", "where": "United States", "idea": "A minimal state protects rights, and taxing people to redistribute wealth is unjust.", "rundown": "In Anarchy, State, and Utopia, Nozick answered Rawls. He argued that if people acquire things fairly and trade freely, the result is just, however unequal it is. Government should be limited to protecting people from force, theft, and fraud.", "quote": "Taxation of earnings from labor is on a par with forced labor.", "challenge": "Nozick said taxes to help the poor are like forced labor. Rawls disagreed. Who do you side with, and why?", "born": 1938, "died": 2002, "era": "modern", "world": [{"when": "1964–1965", "what": "The United States launches the Great Society programs against poverty."}, {"when": "1974", "what": "He publishes Anarchy, State, and Utopia, three years after Rawls's A Theory of Justice."}], "link": "He was Rawls's colleague at Harvard and drew on Locke's theory of property.", "cites": {"0": {"work": "asu", "loc": "", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": true}, "2": {"work": "asu", "loc": "ch. 7, Natural Assets and Arbitrariness", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": false}, "6": {"work": "asu", "loc": "ch. 3, The Minimal State and the Ultraminimal State", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": false}, "9": {"work": "asu", "loc": "", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": true}, "11": {"work": "asu", "loc": "ch. 3, Libertarian Constraints", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": false}, "12": {"work": "asu", "loc": "", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": true}, "13": {"work": "asu", "loc": "ch. 7, Locke's Theory of Acquisition", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": false}, "14": {"work": "asu", "loc": "ch. 7, The Entitlement Theory", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": false}, "16": {"work": "asu", "loc": "", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": true}, "17": {"work": "asu", "loc": "ch. 3, The Minimal State and the Ultraminimal State", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": false}, "18": {"work": "asu", "loc": "ch. 7, How Liberty Upsets Patterns", "url": "https://plato.stanford.edu/entries/nozick-political/", "general": false}}, "quoteSrc": {"work": "asu", "loc": "ch. 7, Redistribution and Property Rights", "url": "https://plato.stanford.edu/entries/nozick-political/"}, "read": ["asu"], "life": [{"label": "Wikipedia: Robert Nozick", "url": "https://en.wikipedia.org/wiki/Robert_Nozick"}, {"label": "Wikipedia: Great Society", "url": "https://en.wikipedia.org/wiki/Great_Society"}]}], "eras": [{"id": "ancient", "name": "The ancient world", "blurb": "Thinkers in China and Greece ask what makes a ruler legitimate and a person good."}, {"id": "medieval", "name": "Empires and city-states", "blurb": "Dynasties rise and fall, and writers start studying power as it really works."}, {"id": "revolutions", "name": "The age of revolutions", "blurb": "Civil wars and revolutions in England, America, and France put the social contract to the test."}, {"id": "industrial", "name": "The industrial age", "blurb": "Factories, slavery, and the fight for the vote raise new questions about freedom and equality."}, {"id": "modern", "name": "The twentieth century", "blurb": "World wars, totalitarianism, independence movements, and civil rights reshape ideas of justice."}], "questions": [{"area": "Human nature", "q": "Imagine there were no government at all. What would people mostly do?", "answers": [{"text": "Fight and grab, because everyone is afraid of everyone else", "strong": ["hobbes", "machiavelli"], "partial": ["burke", "ibnkhaldun"]}, {"text": "Mostly get along and respect each other's rights, but argue over disputes", "strong": ["locke", "paine"], "partial": ["montesquieu", "nozick", "douglass"]}, {"text": "Live simply and peacefully. It's society that makes people greedy", "strong": ["rousseau"], "partial": ["marx", "gandhi"]}, {"text": "That can't happen. People only become fully human in a community", "strong": ["aristotle", "confucius", "ibnkhaldun"], "partial": ["plato", "burke", "arendt"]}]}, {"area": "Human nature", "q": "What are people like when they are born?", "answers": [{"text": "Selfish and looking out for themselves", "strong": ["hobbes", "machiavelli"], "partial": ["ibnkhaldun"]}, {"text": "A blank slate, shaped by experience and education", "strong": ["locke", "wollstonecraft", "beauvoir"], "partial": ["mill", "marx", "ibnkhaldun"]}, {"text": "Naturally good, until society corrupts them", "strong": ["rousseau"], "partial": ["gandhi", "paine"]}, {"text": "Able to become good, but only through practice, habit, and guidance", "strong": ["confucius", "aristotle"], "partial": ["plato", "gandhi", "king"]}]}, {"area": "Human nature", "q": "What shapes who a person becomes the most?", "answers": [{"text": "Their education", "strong": ["wollstonecraft", "plato"], "partial": ["mill", "confucius", "douglass", "king"]}, {"text": "Their economic class and working conditions", "strong": ["marx"], "partial": ["rousseau"]}, {"text": "Family, tradition, and the customs they grow up in", "strong": ["burke", "confucius", "ibnkhaldun"], "partial": ["aristotle"]}, {"text": "Their own choices and hard work", "strong": ["nozick", "douglass", "beauvoir"], "partial": ["locke", "arendt", "gandhi"]}]}, {"area": "Education", "q": "What is the most important thing schools should teach?", "answers": [{"text": "How to think and reason independently", "strong": ["wollstonecraft", "mill", "arendt"], "partial": ["locke", "beauvoir", "paine"]}, {"text": "Good character, respect, and duty to others", "strong": ["confucius", "aristotle", "gandhi"], "partial": ["burke", "king"]}, {"text": "Reading and knowledge, as the path to freedom", "strong": ["douglass"], "partial": ["wollstonecraft", "locke", "king"]}, {"text": "Preparing each person for their role in society", "strong": ["plato"], "partial": ["rousseau"]}, {"text": "An understanding of who holds power and why", "strong": ["marx"], "partial": ["machiavelli", "beauvoir"]}]}, {"area": "Government", "q": "Where does a government get its right to rule?", "answers": [{"text": "From the consent of the people it governs", "strong": ["locke", "paine"], "partial": ["wollstonecraft", "douglass", "rawls", "king", "gandhi"]}, {"text": "From the wisdom and virtue of its rulers", "strong": ["plato", "confucius"], "partial": ["aristotle"]}, {"text": "From its power to keep order and stop chaos", "strong": ["hobbes", "machiavelli"], "partial": ["ibnkhaldun"]}, {"text": "From history and traditions built up over generations", "strong": ["burke"], "partial": ["montesquieu", "ibnkhaldun"]}, {"text": "From the shared will of the whole community", "strong": ["rousseau", "arendt"], "partial": ["marx", "gandhi"]}]}, {"area": "Government", "q": "Who should make the laws?", "answers": [{"text": "One strong ruler with final say", "strong": ["hobbes"], "partial": ["machiavelli", "ibnkhaldun"]}, {"text": "A small group of the wisest, best-trained people", "strong": ["plato"], "partial": ["confucius"]}, {"text": "A balanced mix of one leader, a few elites, and the many", "strong": ["aristotle", "montesquieu"], "partial": ["burke"]}, {"text": "All the people together, deciding directly", "strong": ["rousseau", "arendt", "gandhi"], "partial": ["marx"]}, {"text": "Representatives elected by the people", "strong": ["mill", "paine"], "partial": ["locke", "wollstonecraft", "douglass", "rawls", "king"]}]}, {"area": "Government", "q": "How should power be arranged?", "answers": [{"text": "Concentrated in one place, so government can act decisively", "strong": ["hobbes"], "partial": ["machiavelli"]}, {"text": "Split into branches that check and balance each other", "strong": ["montesquieu"], "partial": ["locke", "aristotle", "arendt", "paine"]}, {"text": "As limited as possible, only enough to protect rights", "strong": ["nozick", "paine"], "partial": ["locke"]}, {"text": "Spread out to small local communities that govern themselves", "strong": ["gandhi"], "partial": ["arendt", "rousseau"]}, {"text": "Eventually not needed at all, once classes disappear", "strong": ["marx"], "partial": []}]}, {"area": "Government", "q": "A government starts abusing its power. What should the people do?", "answers": [{"text": "Obey anyway, because rebellion is worse than a bad ruler", "strong": ["hobbes"], "partial": []}, {"text": "Rise up and overthrow it if they have to", "strong": ["locke", "paine"], "partial": ["marx", "wollstonecraft", "rousseau", "douglass"]}, {"text": "Refuse to obey through peaceful protest and civil disobedience", "strong": ["king", "gandhi"], "partial": ["arendt", "douglass"]}, {"text": "Push for careful reform that keeps what works", "strong": ["burke"], "partial": ["montesquieu", "mill"]}, {"text": "Speak up and urge leaders to act rightly", "strong": ["confucius"], "partial": ["plato", "mill"]}]}, {"area": "Government", "q": "What matters most in a leader?", "answers": [{"text": "Being a good moral example for everyone else", "strong": ["confucius", "gandhi"], "partial": ["aristotle", "plato", "king"]}, {"text": "Knowledge and wisdom", "strong": ["plato"], "partial": ["aristotle"]}, {"text": "Getting results and holding on to power, even if it means being feared", "strong": ["machiavelli"], "partial": ["hobbes", "ibnkhaldun"]}, {"text": "Being accountable to the people and the law", "strong": ["locke"], "partial": ["mill", "montesquieu", "douglass", "paine", "arendt"]}]}, {"area": "Rights", "q": "Where do people's rights come from?", "answers": [{"text": "From nature or God. Everyone has them before any government exists", "strong": ["locke", "douglass", "paine", "king"], "partial": ["wollstonecraft", "nozick", "gandhi"]}, {"text": "From agreements people make with each other", "strong": ["rawls"], "partial": ["hobbes", "rousseau"]}, {"text": "From belonging to a community and its laws and traditions", "strong": ["burke", "arendt"], "partial": ["aristotle", "montesquieu"]}, {"text": "\"Rights\" mean little until the economy is fair for workers", "strong": ["marx"], "partial": []}]}, {"area": "Rights", "q": "How much freedom of speech should people have?", "answers": [{"text": "Almost total. Even wrong ideas help us find the truth", "strong": ["mill", "paine", "arendt"], "partial": ["douglass", "wollstonecraft", "king", "beauvoir"]}, {"text": "Limited whenever speech threatens peace and order", "strong": ["hobbes"], "partial": ["machiavelli"]}, {"text": "Guided by respect, manners, and tradition", "strong": ["confucius"], "partial": ["burke", "gandhi"]}, {"text": "Controlled so it teaches people what is good for the community", "strong": ["plato"], "partial": ["rousseau"]}]}, {"area": "Freedom", "q": "Should the law stop you from doing something that only hurts yourself?", "answers": [{"text": "No. If it harms no one else, it's your choice", "strong": ["mill", "nozick"], "partial": ["locke", "beauvoir"]}, {"text": "Yes. Good laws should help people become good", "strong": ["aristotle", "plato"], "partial": ["confucius", "gandhi"]}, {"text": "Sometimes, if it keeps society stable", "strong": ["hobbes"], "partial": ["burke"]}]}, {"area": "Freedom", "q": "What does it mean to be free?", "answers": [{"text": "Doing what you want, as long as you don't harm others", "strong": ["mill"], "partial": ["nozick", "hobbes"]}, {"text": "Taking part in making the laws you live under", "strong": ["rousseau", "arendt"], "partial": ["locke", "montesquieu", "paine"]}, {"text": "Not being owned, controlled, or kept down by another person", "strong": ["douglass", "wollstonecraft", "king", "beauvoir"], "partial": ["gandhi"]}, {"text": "Having the food, time, and resources to develop yourself", "strong": ["marx"], "partial": ["rawls", "king"]}]}, {"area": "Property", "q": "What is private property?", "answers": [{"text": "A natural right. What you make with your own work is yours", "strong": ["locke", "nozick"], "partial": ["paine"]}, {"text": "The root of inequality and conflict", "strong": ["rousseau", "marx"], "partial": ["plato", "gandhi"]}, {"text": "Useful, but it should be managed for the good of everyone", "strong": ["rawls", "gandhi", "king"], "partial": ["aristotle", "mill", "paine"]}, {"text": "Only safe because a strong government protects it", "strong": ["hobbes"], "partial": ["burke", "ibnkhaldun"]}]}, {"area": "Property", "q": "Some people are very rich and others are very poor. Is that okay?", "answers": [{"text": "Yes, as long as the wealth was earned or traded fairly", "strong": ["nozick"], "partial": ["locke", "burke"]}, {"text": "Only if the system also makes life better for the poorest", "strong": ["rawls", "king"], "partial": ["mill", "paine"]}, {"text": "No. The rich get rich by exploiting workers, so the class system must end", "strong": ["marx"], "partial": ["rousseau", "beauvoir"]}, {"text": "Extremes are dangerous. A large middle class is /* ---------- History machine ----------
   Lifespans on one axis with a break: 600–300 BCE gets the left 22%, 1300–2025 CE the rest,
   since no thinker here lived in between. */
const AX = { left: 170, width: 570, a0: -600, a1: -300, b0: 1300, b1: 2025, aw: 0.22, gap: 0.04 };
function xOf(y) {
  const { left, width, a0, a1, b0, b1, aw, gap } = AX;
  if (y <= a1) return left + ((y - a0) / (a1 - a0)) * aw * width;
  return left + (aw + gap) * width + ((y - b0) / (b1 - b0)) * (1 - aw - gap) * width;
}
const yearLabel = y => y < 0 ? `${-y} BCE` : `${y}`;
function lifespanChart(pcts) {
  const rowH = 22, top = 34, list = DATA.thinkers, h = top + list.length * rowH + 8;
  const sel = new Set(state.selected);
  const ranked = pcts ? Object.entries(pcts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]) : [];
  const ticks = [-550, -350, 1400, 1500, 1600, 1700, 1800, 1900, 2000];
  const bx = xOf(AX.a1) + (AX.gap * AX.width) / 2;
  let s = `<svg viewBox="0 0 760 ${h}" role="img" aria-label="Lifespans of the thinkers on a timeline" style="width:100%;min-width:620px;display:block">`;
  ticks.forEach(t => {
    const x = xOf(t);
    s += `<line x1="${x}" x2="${x}" y1="${top - 6}" y2="${h - 6}" stroke="var(--rule)" stroke-width="1"/>`;
    s += `<text x="${x}" y="${top - 12}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${yearLabel(t)}</text>`;
  });
  s += `<text x="${bx}" y="${top - 12}" text-anchor="middle" font-size="12" fill="var(--muted)">//</text>`;
  s += `<line x1="${bx}" x2="${bx}" y1="${top - 6}" y2="${h - 6}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>`;
  list.forEach((t, k) => {
    const y = top + k * rowH, x1 = xOf(t.born), x2 = xOf(t.died), on = sel.has(t.id);
    const isTop = ranked.includes(t.id), pct = pcts && pcts[t.id] != null ? ` ${pcts[t.id]}%` : "";
    const fill = isTop ? "var(--accent)" : on ? "var(--bar)" : "var(--rule)";
    s += `<g opacity="${on ? 1 : 0.55}">`;
    s += `<text x="${AX.left - 10}" y="${y + 13}" text-anchor="end" font-size="12.5" fill="var(--ink)" font-weight="${isTop ? 700 : 400}">${esc(t.name)}</text>`;
    s += `<rect x="${x1}" y="${y + 3}" width="${Math.max(3, x2 - x1)}" height="13" rx="2" fill="${fill}"/>`;
    if (pct) s += `<text x="${x2 + 6}" y="${y + 13}" font-size="11" font-family="IBM Plex Mono, monospace" fill="${isTop ? "var(--accent)" : "var(--muted)"}">${pct.trim()}</text>`;
    s += `</g>`;
  });
  return s + `</svg>`;
}

    <div class="row">

  document.getElementById("to-timeline").onclick = openTimeline;

  app.querySelectorAll("input[data-id]").forEach(cb => cb.onchange = () => {

  const copy = document.getElementById("copy-link");

  document.getElementById("start").onclick = () => { state.i = Math.max(0, state.answers.findIndex(a => a === null)); if (state.i < 0) state.i = 0; go("quiz"); };
  const restart = document.getElementById("restart");
  if (restart) restart.onclick = () => { state.answers = state.answers.map(() => null); state.weights = state.weights.map(() => false); save(); renderSetup(); };
}

function copyText(text, field, toastId, msg) {
  const toast = document.getElementById(toastId);
  const fallback = () => { if (field) { field.hidden = false; field.focus(); field.select(); } toast.textContent = "Press Ctrl+C (or Cmd+C) to copy the selected text."; };
  try {
    navigator.clipboard.writeText(text).then(() => { toast.textContent = msg; }, fallback);
  } catch (e) { fallback(); }
}

/* ---------- Quiz ---------- */

  app.innerHTML = `

      <div class="qhead"><span>Question ${i + 1} of ${n}</span><span>${esc(q.area)}</span></div>
      <div class="progress" aria-hidden="true"><div style="width:${(done / n) * 100}%"></div></div>
    </div>

      ${q.answers.map((a, k) => `<button class="answer" data-k="${k}" aria-pressed="${picked === k}"><span class="letter">${LETTERS[k]}</span><span>${esc(a.text)}</span></button>`).join("")}
    </div>

    <div class="nav">
      <button class="btn ghost" id="back">${i === 0 ? "Thinkers" : "Back"}</button>
      ${i < n - 1
        ? `<button class="btn" id="next" ${picked === null ? "disabled" : ""}>Next</button>`
        : `<button class="btn" id="analyze" ${done < n ? "disabled" : ""}>Analysis</button>`}
    </div>
    ${i === n - 1 && done < n ? `<p class="muted">Answer every question to unlock the analysis. <button class="link" id="jump">Go to the first one you skipped</button></p>` : ""}`;
  app.querySelectorAll(".answer").forEach(b => b.onclick = () => {
    state.answers[i] = +b.dataset.k; save();
    if (i < n - 1) setTimeout(() => { state.i = i + 1; save(); renderQuiz(); }, 180);
    renderQuiz();
  });
  document.getElementById("matters").onchange = e => { state.weights[i] = e.target.checked; save(); };
  document.getElementById("back").onclick = () => { if (i === 0) go("setup"); else { state.i = i - 1; save(); renderQuiz(); } };
  const next = document.getElementById("next");
  if (next) next.onclick = () => { state.i = i + 1; save(); renderQuiz(); };
  const an = document.getElementById("analyze");
  if (an) an.onclick = () => go("results");
  const jump = document.getElementById("jump");
  if (jump) jump.onclick = () => { state.i = state.answers.findIndex(a => a === null); save(); renderQuiz(); };
}

/* ---------- Scoring ----------
   Each thinker earns 2 points for an answer that is their clear position and 1 for a partial match,
   doubled on questions the student marked as important. A thinker's agreement is the share of the
   points they could have earned, so thinkers who appear in fewer answers are not buried.
   The percentages split 100% among the chosen thinkers, weighted toward stronger agreement. */
function pts(a, id) { return a.strong.includes(id) ? 2 : a.partial.includes(id) ? 1 : 0; }
function score() {
  const rows = state.selected.map(id => {
    let earned = 0, max = 0;
    DATA.questions.forEach((q, i) => {
      const w = state.weights[i] ? 2 : 1;
      const best = Math.max(...q.answers.map(a => pts(a, id)));
      if (!best) return;
      max += best * w;
      if (state.answers[i] !== null) earned += pts(q.answers[state.answers[i]], id) * w;
    });
    return { id, agree: max ? earned / max : 0 };
  });
  const total = rows.reduce((s, r) => s + r.agree ** 3, 0);
  rows.forEach(r => r.share = total ? (r.agree ** 3) / total * 100 : 100 / rows.length);
  rows.sort((a, b) => b.share - a.share);
  roundTo100(rows);
  return rows;
}
function roundTo100(rows) {
  rows.forEach(r => r.pct = Math.floor(r.share));
  let left = 100 - rows.reduce((s, r) => s + r.pct, 0);
  [...rows].sort((a, b) => (b.share % 1) - (a.share % 1)).slice(0, left).forEach(r => r.pct++);
}
function agreements(id) {
  const out = [];
  DATA.questions.forEach((q, i) => { const a = q.answers[state.answers[i]]; const p = pts(a, id); if (p) out.push({ i, p, mine: a.text }); });
  return out.sort((x, y) => y.p - x.p || state.weights[y.i] - state.weights[x.i]);
}
function disagreements(id) {
  const out = [];
  DATA.questions.forEach((q, i) => {
    const mine = q.answers[state.answers[i]];
    const theirs = q.answers.find(a => a.strong.includes(id));
    if (theirs && !pts(mine, id)) out.push({ i, mine: mine.text, theirs: theirs.text });
  });
  return out.sort((x, y) => state.weights[y.i] - state.weights[x.i]);
}
const last = name => name.replace(/ Jr\.$/, "").split(" ").slice(-1)[0];
const short = id => ({ king: "King", ibnkhaldun: "Ibn Khaldun", confucius: "Confucius", plato: "Plato", aristotle: "Aristotle", montesquieu: "Montesquieu" }[id] || last(T[id].name));

/* ---------- Results ---------- */
function renderResults() {
  const rows = score(), top = rows.slice(0, Math.min(3, rows.length)), bottom = rows[rows.length - 1];
  const lead = T[rows[0].id];
  const dis0 = disagreements(lead.id)[0];
  const discuss = [
    lead.challenge,
    `Your society is furthest from ${T[bottom.id].name}'s. Write ${short(bottom.id)}'s strongest objection to your society. How would you answer it?`,
    dis0 ? `You and ${short(lead.id)} split on "${DATA.questions[dis0.i].q}" Who is right, and why?` : `You agreed with ${short(lead.id)} on every question where they took a clear side. Is there anything about their society you would still change?`,
    `Find a classmate whose top match was different from yours. Could your two societies exist side by side? What would they fight about?`,
    `Which one answer would you change now, and how would that change your society?`,
  ];
  const areas = [];
  DATA.questions.forEach((q, i) => { let g = areas.find(a => a.area === q.area); if (!g) areas.push(g = { area: q.area, items: [] }); g.items.push(i); });

  app.innerHTML = `
    <header class="mast verdict">
      <span class="eyebrow">Analysis</span>
      <p class="big">Your society is <em>${rows[0].pct}% ${esc(short(lead.id))}</em></p>
      <p class="muted">${esc(lead.name)} (${esc(lead.lived)}): ${esc(lead.idea)}</p>
    </header>

    <section class="sheet stack">
      <h2>Your mix of thinkers</h2>
      <div class="bars">
        ${rows.map((r, k) => `<div class="bar ${k === 0 ? "top" : ""}"><span class="name">${esc(T[r.id].name)}</span><span class="track"><span class="fill" style="display:block;width:${(r.share / rows[0].share) * 100}%"></span></span><span class="pct">${r.pct}%</span></div>`).join("")}
      </div>
      <p class="muted" style="font-size:0.85rem">Percentages are split among the ${rows.length} thinkers you chose. Questions you marked as important count double.</p>
    </section>

    <section class="stack">
      <h2>Your closest matches</h2>
      <div class="sheet">
        ${top.map(r => {
          const t = T[r.id], ag = agreements(r.id).slice(0, 3), di = disagreements(r.id).slice(0, 2);
          return `<article class="match">
            <div class="head"><h3>${esc(t.name)}</h3><span class="pct">${r.pct}%</span></div>
            <span class="lived muted" style="font:0.8rem var(--mono)">${esc(t.lived)} · ${esc(t.where)}</span>
            <p>${esc(t.rundown)}</p>
            ${t.quote ? `<blockquote>"${esc(t.quote)}"${quoteCite(t)}</blockquote>` : ""}
            <div class="pair">
              <div><h4>Where you agree</h4><ul>${ag.length ? ag.map(x => `<li>${esc(x.mine)}${cite(r.id, x.i, x.p === 2 ? "Where " + short(r.id) + " says it" : "Closest passage")}</li>`).join("") : "<li>Not much. This match comes from a handful of partial overlaps.</li>"}</ul></div>
              <div><h4>Where you part ways</h4><ul>${di.length ? di.map(x => `<li>You said "${esc(x.mine)}." ${esc(short(r.id))} would say "${esc(x.theirs)}."${cite(r.id, x.i, "Where " + short(r.id) + " says it")}</li>`).join("") : `<li>Nowhere that ${esc(short(r.id))} took a clear side.</li>`}</ul></div>
            </div>
            <div class="stack" style="gap:6px"><h4 style="margin:0;font:500 0.75rem var(--mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)">Read ${esc(short(r.id))}'s own words</h4>${readingList(t)}</div>
          </article>`;
        }).join("")}
        <p class="muted" style="font-size:0.85rem;margin-top:12px">Every link opens the thinker's own writing in a new tab. See the <button class="link" id="res-sources">answer key and sources</button> for where every thinker stands on every question.</p>
      </div>
    </section>

    <section class="sheet stack">
      <h2>Your society's charter</h2>
      <p class="muted">These are the answers you chose, written as the founding principles of your society.</p>
      <div class="charter">
        ${areas.map((g, k) => `<div class="article"><span class="num">Article ${["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"][k]}<br>${esc(g.area)}</span><ul>${g.items.map(i => `<li>${esc(DATA.questions[i].answers[state.answers[i]].text)}.${state.weights[i] ? ` <span class="star">(matters most)</span>` : ""}</li>`).join("")}</ul></div>`).join("")}
      </div>
    </section>

    <section class="sheet stack">
      <h2>Your matches through history</h2>
      <p class="muted">Your society borrows from thinkers who lived as much as ${Math.max(...top.map(r => T[r.id].died)) - Math.min(...top.map(r => T[r.id].born))} years apart.</p>
      <div class="chartwrap">${lifespanChart(Object.fromEntries(rows.map(r => [r.id, r.pct])))}</div>
      <div class="row"><button class="btn ghost" id="res-timeline">See what was happening in their world</button></div>
    </section>

    <section class="stack">
      <h2>Discussion</h2>
      <ol class="discuss">${discuss.map(d => `<li>${esc(d)}</li>`).join("")}</ol>
    </section>

    <section class="stack">
      <div class="row">
        <button class="btn" id="copy-results">Copy my results</button>
        <button class="btn ghost" id="review">Change my answers</button>
        <button class="btn ghost" id="again">Play again</button>
      </div>
      <span class="toast" id="results-toast" aria-live="polite"></span>
      <textarea id="results-text" readonly hidden rows="10" style="width:100%;font:0.85rem var(--mono);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px"></textarea>
    </section>`;

  const text = [
    `My perfect society (The Perfect Society game)`, ``,
    ...rows.map(r => `${r.pct}%  ${T[r.id].name}`), ``,
    `My charter:`, ...DATA.questions.map((q, i) => `${i + 1}. ${q.q} ${q.answers[state.answers[i]].text}${state.weights[i] ? " (matters most)" : ""}`), ``,
    `Discussion:`, ...discuss.map((d, k) => `${k + 1}. ${d}`), ``,
    `Sources for my top matches:`, ...top.flatMap(r => [`${T[r.id].name}:`, ...T[r.id].read.map(k => `  ${W[k].title} (${W[k].year}) ${W[k].url}`)]),
  ].join("\n");
  document.getElementById("copy-results").onclick = () => {
    const ta = document.getElementById("results-text"); ta.value = text;
    copyText(text, ta, "results-toast", "Copied. Paste your results into your assignment.");
  };
  document.getElementById("review").onclick = () => { state.i = 0; go("quiz"); };
  document.getElementById("res-timeline").onclick = openTimeline;
  document.getElementById("res-sources").onclick = openSources;
  document.getElementById("again").onclick = () => { state.answers = state.answers.map(() => null); state.weights = state.weights.map(() => false); state.i = 0; go("setup"); };
}

    <header class="mast">
      <span class="eyebrow">Answer key and sources</span>
      <h1>Where the answers come from</h1>
      <p>Every match in this game is based on what the thinkers actually wrote. For each answer, you can see which thinkers hold that view and the passage where they say it. Links open the original text in a new tab.</p>
    </header>
    <div class="row"><button class="btn ghost" id="src-back">${backLabel()}</button></div>
    <section class="sheet stack">
      <h3>How to read the citations</h3>
      <p class="muted" style="font-size:0.92rem"><strong>Strong</strong> means this answer is the thinker's clear position (2 points). <strong>Partial</strong> means they lean this way (1 point). A citation with a chapter, section, or quoted phrase points to the exact passage. "Read more" means the view runs through the whole work, so the link goes to the book itself. Older books are free online. A few modern books (Rawls, Nozick, Arendt, and most of Beauvoir) are still under copyright, so those links go to a trusted guide and you can find the book in a library.</p>
      ${mine ? "" : `<p class="muted" style="font-size:0.92rem"><strong>Students:</strong> you may want to play first, so the key doesn't steer your answers.</p>`}

          <h3>${esc(q.q)}</h3>
          ${q.answers.map((a, k) => {

              <ul>${who.length ? who.map(([id, kind]) => `<li style="${sel.has(id) ? "" : "opacity:0.7"}">${esc(T[id].name)} <span class="tag">${kind}</span>${cite(id, i)}</li>`).join("") : `<li class="muted">No thinker in this game holds this view.</li>`}</ul>
            </div>`;

      </div>

    <div class="row"><button class="btn ghost" id="src-back2">${backLabel()}</button></div>`;
  document.getElementById("src-back").onclick = goBack;
  document.getElementById("src-back2").onclick = goBack;

window.addEventListener("hashchange", () => { const h = parseHash(); if (h) { state = fresh(); state.selected = h; state.locked = true; save(); render(); } });
render();
